strictness: medium
test-warnings: true
doc-warnings: true

# Django migrations are generated historical records. Reformatting them creates
# noisy migrations without improving the application code.
ignore-patterns:
  - (^|.*[\\/])migrations([\\/]|$)

pydocstyle:
  disable:
    # The repository uses Google-style docstrings with no blank line between a
    # class declaration and its docstring.
    - D203
    # Summaries start on the opening-quote line.
    - D213
    # Google-style section names end in colons and are not underlined.
    - D406
    - D407

# Codacy runs dedicated Pylint and related error-prone analysers. Avoid
# duplicating those findings through Prospector while retaining its
# pycodestyle and repository-specific pydocstyle configuration.
pyflakes:
  run: false

pylint:
  run: false
